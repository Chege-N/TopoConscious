name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build_wheels:
    name: Build wheels on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build manylinux wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_SKIP: "pp* *-musllinux_*"   # skip PyPy and musllinux
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL: "pip install pybind11"
          CIBW_ENVIRONMENT: "CMAKE_ARGS=-DPYBIND11_FINDPYTHON=ON"

      - name: Build sdist (source distribution)
        run: |
          python -m pip install build
          python -m build --sdist
          cp dist/*.tar.gz wheelhouse/   # copy sdist into wheelhouse for upload

      - name: Upload to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse   # now contains both wheels and sdist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: wheelhouse/*
