name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pybind11
          pip install -r requirements.txt

      - name: Install package (skip C++ extension)
        run: |
          # Temporarily disable C++ ext for CI (pure Python fallback is used)
          sed -i 's/ext_modules=\[topo_te_ext\]/ext_modules=[]/' setup.py
          pip install -e .
          sed -i 's/ext_modules=\[\]/ext_modules=[topo_te_ext]/' setup.py

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=topoconscious \
            --cov-report=term-missing \
            --cov-report=xml \
            -W ignore::UserWarning

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
